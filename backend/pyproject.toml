[project]
name = "agents-template"
version = "0.1.0"
description = "FastAPI + LangGraph multi-agent infrastructure with streaming, history, and auto-discovery"
requires-python = ">=3.13"
dependencies = [
    "asyncpg>=0.31.0",
    "curl-cffi>=0.15.0",
    "duckpy>=2.1.1",
    "fastapi>=0.136.1",
    "granian>=2.7.4",
    "groq>=0.37.1",
    "ipykernel>=7.2.0",
    "ipywidgets>=8.1.8",
    "langchain>=1.2.17",
    "langchain-cerebras>=0.8.2",
    "langchain-community>=0.4.1",
    "langchain-core>=1.3.2",
    "langchain-deepseek>=1.0.1",
    "langchain-google-genai>=4.2.2",
    "langchain-groq>=1.1.2",
    "langchain-nvidia-ai-endpoints>=1.2.1",
    "langchain-openai>=1.2.1",
    "langgraph>=1.1.10",
    "langgraph-checkpoint-postgres>=3.0.5",
    "markitdown[all]>=0.1.5",
    "numpy>=2.2.0",
    "opencv-python-headless>=4.13.0.92",
    "orjson>=3.11.8",
    "psycopg2-binary>=2.9.12",
    "pydantic>=2.13.3",
    "pymupdf>=1.27.2.3",
    "python-dotenv>=1.2.2",
    "structlog>=25.5.0",
    "uvicorn>=0.46.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["config", "src/api"]

[tool.hatch.build.targets.wheel.sources]
"config" = "config"
"src/api" = "api"
