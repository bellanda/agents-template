# ============================================================================
# INGRESS_MODE=loopback — DEV LOCAL
# ----------------------------------------------------------------------------
# Plain HTTP :80 (sem SSL — TLS não faz sentido em 127.0.0.1). Sem HSTS (NUNCA em dev:
# persiste no navegador e quebra http://localhost).
# ============================================================================

server {
    listen 80;
    listen [::]:80;
    http2 on;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_max_body_size 20M;

    access_log /var/log/nginx/access.log json_combined;
    error_log /var/log/nginx/error.log warn;

    # Real IP — no-op em loopback (cliente conecta direto via 127.0.0.1); mantido p/ paridade com gateway.
    include /etc/nginx/snippets/real-ip.conf;

    # Security headers (sem HSTS).
    include /etc/nginx/snippets/security-headers-base.conf;

    # Compressão (gzip).
    include /etc/nginx/snippets/compression.conf;

    # Routing — ordem de matching do nginx (não declaração):
    # 1. location =        (exato — index.html, healthz, robots.txt)
    # 2. location ^~       (prefixo prioritário — /api/, /assets/)
    # 3. location ~*       (regex — arquivos estáticos de public/)
    # 4. location /        (fallback SPA)

    # robots.txt: Disallow em TODO modo deste template. Um único robots.txt no bundle valeria
    # para staging e prod ao mesmo tempo; responder Disallow aqui impede staging de competir
    # com produção no índice. Produtos com modo `edge` (prod dedicado) servem o do bundle lá.
    # `location =` vence o try_files do SPA.
    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }
    include /etc/nginx/snippets/api-proxy.conf;
    include /etc/nginx/snippets/spa-routing.conf;
    include /etc/nginx/snippets/error-pages.conf;
    include /etc/nginx/snippets/healthz.conf;
}
