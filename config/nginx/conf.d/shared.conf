# ============================================================================
# HTTP-CONTEXT SHARED CONFIG
# ----------------------------------------------------------------------------
# Diretivas que precisam viver fora de server {} blocks:
# upstream, map, rate limit zones, log formats.
# Carregado como `00-shared.conf` para garantir ordem antes de default.conf.
# ============================================================================

# ----------------------------------------------------------------------------
# UPSTREAM: API BACKEND
# Connection pooling: mantém conexões TCP persistentes com o backend,
# elimina overhead de handshake a cada request.
# ----------------------------------------------------------------------------
upstream backend_api {
    # TCP over the compose `internal` network (Granian listens on 0.0.0.0:8000, see the backend
    # Dockerfile CMD). Product apps use a UDS shared via a volume instead — switch both sides
    # together if you need it.
    server backend:8000;
    keepalive 64;
    keepalive_requests 1000;
    keepalive_timeout 60s;
}

# ----------------------------------------------------------------------------
# WEBSOCKET UPGRADE MAP
# Permite que `proxy_set_header Connection $connection_upgrade` funcione
# tanto para requests HTTP normais quanto para handshake WebSocket.
# ----------------------------------------------------------------------------
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ----------------------------------------------------------------------------
# REQUEST ID
# Usa X-Request-ID enviado pelo cliente (gateway/CDN) ou gera um novo.
# Útil para correlacionar logs nginx ↔ logs backend.
# ----------------------------------------------------------------------------
map $http_x_request_id $request_id_final {
    default $http_x_request_id;
    ""      $request_id;
}

# ----------------------------------------------------------------------------
# RATE LIMITING ZONES
# - api_general: tráfego geral da API (30 req/s por IP, burst 50)
# - api_auth:    endpoints sensíveis (login, register, password reset). Sem rota /auth no
#                template; a zona fica pronta p/ quando o app clonado ganhar auth real.
# 10MB de zona = ~160k IPs rastreados.
# ----------------------------------------------------------------------------
limit_req_zone $binary_remote_addr zone=api_general:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=api_auth:10m rate=5r/s;
limit_req_status 429;

# ----------------------------------------------------------------------------
# LOG FORMAT JSON
# Estruturado para ingest em Loki/ELK/Datadog/CloudWatch sem regex.
# ----------------------------------------------------------------------------
log_format json_combined escape=json
    '{'
    '"time":"$time_iso8601",'
    '"remote_addr":"$remote_addr",'
    '"x_forwarded_for":"$http_x_forwarded_for",'
    '"request_method":"$request_method",'
    '"request_uri":"$request_uri",'
    '"status":$status,'
    '"body_bytes_sent":$body_bytes_sent,'
    '"request_time":$request_time,'
    '"upstream_response_time":"$upstream_response_time",'
    '"upstream_status":"$upstream_status",'
    '"http_referer":"$http_referer",'
    '"http_user_agent":"$http_user_agent",'
    '"request_id":"$request_id_final"'
    '}';