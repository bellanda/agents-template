# ============================================================================
# REAL IP — quando o nginx está atrás de outro proxy (gateway, CDN)
# ----------------------------------------------------------------------------
# Sem isso, $remote_addr e $binary_remote_addr são o IP do proxy upstream
# (gateway central / CDN), o que faz:
#   1. Logs perderem o IP real do cliente
#   2. Rate limit (limit_req_zone $binary_remote_addr) ser POR PROXY,
#      não por cliente — efetivamente desativando rate limit em escala
#
# Trust ranges restritos a redes privadas (Docker bridge, RFC1918).
# Em prod direto na internet (sem CDN), NÃO incluir este snippet — permitiria
# spoofing de IP via header X-Forwarded-For por clientes maliciosos.
# Em prod com CDN (Cloudflare/Fastly), trocar por ranges oficiais do CDN.
# ============================================================================

# Docker default bridge + RFC1918 (gateway central na mesma rede privada).
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;

# Header onde o gateway insere o IP do cliente.
real_ip_header X-Forwarded-For;

# Pega o IP "mais à esquerda" da cadeia X-Forwarded-For que NÃO está em
# `set_real_ip_from` — i.e. o cliente original, não os proxies intermediários.
real_ip_recursive on;