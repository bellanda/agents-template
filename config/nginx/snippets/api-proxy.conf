# ============================================================================
# API PROXY — roteia /api/ para backend_api (definido em shared.conf)
# ----------------------------------------------------------------------------
# Backend monta rotas sob `/api/v1/` (ver backend/config/api.py:API_V1_PREFIX).
# ATENÇÃO: se mudar API_V1_PREFIX no backend, atualizar aqui também.
# Rate limit: 30 req/s por IP (burst 50) em toda a API.
#
# `^~` força match prefixo prioritário sobre regex. `proxy_read_timeout` é declarado POR
# location (nunca em api-proxy-pass.conf) — duplicado no mesmo bloco vira [emerg] no boot.
# Quando o app clonado ganhar /auth, copie a location `^~ /api/v1/auth/` do kailos
# (zona `api_auth`, 5 req/s).
# ============================================================================

# Chat com agentes (SSE, POST /api/v1/agents/chat/completions). O stream fica em silêncio
# enquanto uma tool roda (web search, OCR de documento longo) e passa dos 120s do timeout
# padrão: o nginx corta a conexão no meio da resposta. `proxy_read_timeout` mede o gap ENTRE
# bytes, não a duração total, então 300s aqui não afrouxa nada nas outras rotas. O backend já
# manda `X-Accel-Buffering: no` (routes/agents/chat.py), então o nginx não bufferiza o SSE.
location ^~ /api/v1/agents/chat/ {
    limit_req zone=api_general burst=50 nodelay;
    include /etc/nginx/snippets/api-proxy-pass.conf;
    proxy_read_timeout 300s;
}

# Tráfego geral da API
location ^~ /api/ {
    limit_req zone=api_general burst=50 nodelay;
    include /etc/nginx/snippets/api-proxy-pass.conf;
    proxy_read_timeout 120s;
}
