# ============================================================================
# ERROR PAGES + HARDENING
# ============================================================================

error_page 500 502 503 504 /50x.html;

location = /50x.html {
    root /usr/share/nginx/html;
    internal;
}

# Bloqueia arquivos ocultos (.git, .env, .DS_Store, .htaccess, etc).
location ~ /\. {
    deny all;
    access_log off;
    log_not_found off;
}

# Bloqueia arquivos de backup/swap deixados acidentalmente.
location ~* \.(bak|swp|tmp|orig|save|old)$ {
    deny all;
    access_log off;
    log_not_found off;
}