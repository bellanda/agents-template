# ============================================================================
# API PROXY PASS — diretivas comuns às locations /api/*
# ----------------------------------------------------------------------------
# Sub-snippet — não usar diretamente em server {}, só dentro das locations
# definidas em api-proxy.conf.
# ============================================================================

proxy_pass http://backend_api;
proxy_http_version 1.1;

# WebSocket upgrade — funciona transparentemente para HTTP normal também
# (graças ao map $connection_upgrade em shared.conf).
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;

# Repasse de contexto do cliente. Host = $http_host (preserva a porta; $host a
# descarta e quebra redirects absolutos do backend em portas não-padrão).
proxy_set_header Host $http_host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $http_host;
proxy_set_header X-Request-ID $request_id_final;

# Timeouts — generosos para suportar uploads de até 20MB em redes lentas.
# `proxy_read_timeout` NÃO fica aqui: cada location em api-proxy.conf o declara
# (120s no geral, 300s no chat SSE). Se estivesse neste include, o override do chat
# viraria diretiva duplicada no mesmo bloco → nginx [emerg] no boot.
proxy_connect_timeout 10s;     # Conexão inicial — mesma rede Docker, deve ser rápido
proxy_send_timeout 120s;       # Envio — tolera upload lento do cliente
client_body_timeout 120s;

# Buffering — habilitado para liberar workers do backend mais rápido.
# Se houver streaming/SSE/long-polling: desabilitar com `proxy_buffering off;`
proxy_buffering on;
proxy_buffer_size 8k;
proxy_buffers 16 8k;
proxy_busy_buffers_size 16k;

# Resiliência — tenta próximo upstream em caso de erro
# (relevante quando o upstream tem mais de um server).
proxy_next_upstream error timeout http_502 http_503 http_504;
proxy_next_upstream_tries 2;

# Expõe Request ID na resposta — útil para debug pelo cliente
add_header X-Request-ID $request_id_final always;