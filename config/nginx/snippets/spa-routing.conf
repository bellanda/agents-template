# ============================================================================
# SPA ROUTING + STATIC ASSETS
# ----------------------------------------------------------------------------
# Estratégia de cache:
# - index.html → no-store; fallback `/` + version.json → no-cache (revalida sempre)
# - assets c/ hash  → cache 1 ano + immutable (só /assets/, onde o Vite põe o hash)
# - arquivos de public/ (favicon, logos, banner) → cache de 1 dia, sem immutable
# - service worker  → no-cache (atualizações precisam chegar imediatamente)
#
# GOTCHA do nginx: declarar QUALQUER `add_header` dentro de uma location
# CANCELA a herança de TODOS os add_header do server block (security headers).
# Por isso re-incluímos security-headers-base.conf nas locations que setam
# Cache-Control próprio.
# ============================================================================

# ANTI-CACHE: index.html — aponta para JS/CSS com hash, deve ser sempre fresco.
location = /index.html {
    expires off;
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    include /etc/nginx/snippets/security-headers-base.conf;
}

# ANTI-CACHE: Service Worker — atualizações de PWA precisam chegar na hora.
location = /sw.js {
    expires off;
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    include /etc/nginx/snippets/security-headers-base.conf;
}

# ANTI-CACHE: version.json — build id comparado pelo watcher de atualização pós-deploy
# (frontend/src/lib/app-version). Cacheado, o aviso de versão nova nunca dispararia.
# `expires epoch` (Cache-Control: no-cache + Expires no passado) em vez de add_header: sem
# add_header aqui, a location herda TODOS os headers do server (inclusive o HSTS do edge).
location = /version.json {
    expires epoch;
}

# Manifest: cache curto (1h) — invalidação rápida em mudanças de PWA.
location = /manifest.json {
    expires 1h;
    add_header Cache-Control "public, max-age=3600" always;
    include /etc/nginx/snippets/security-headers-base.conf;
}

# CACHE LONGO: só o que o Vite emite em /assets/, com hash no nome. `^~` ganha da regex
# abaixo, então nada fora daqui recebe immutable.
location ^~ /assets/ {
    expires 1y;
    access_log off;
    add_header Cache-Control "public, immutable, max-age=31536000" always;
    include /etc/nginx/snippets/security-headers-base.conf;
    try_files $uri =404;
}

# CACHE CURTO: arquivos de public/ têm nome FIXO. Com immutable de 1 ano (a regra antiga
# valia para qualquer .png/.ico), o favicon novo não chegava nunca: o Cloudflare e o
# navegador seguiam servindo o logo do React do template (2026-09-22).
location ~* \.(js|mjs|css|woff2|woff|ttf|otf|eot|ico|png|jpg|jpeg|gif|svg|webp|avif|wasm|map)$ {
    expires 1d;
    access_log off;
    add_header Cache-Control "public, max-age=86400" always;
    include /etc/nginx/snippets/security-headers-base.conf;
    try_files $uri =404;
}

# SPA FALLBACK: roteamento client-side.
# 1. Tenta arquivo exato | 2. Como diretório | 3. Devolve index.html
# no-cache (revalida sempre): `/` e deep links servem o index.html por aqui (o `= /index.html` acima só casa a URL
# literal). Sem Cache-Control o navegador reaproveitava HTML velho apontando p/ chunks que o
# deploy já apagou (decisão 2026-10-16).
# `expires epoch` pelo mesmo motivo do version.json: preserva a herança dos security headers.
location / {
    expires epoch;
    try_files $uri $uri/ /index.html;
}