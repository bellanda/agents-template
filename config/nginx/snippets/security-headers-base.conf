# ============================================================================
# SECURITY HEADERS — BASE (loopback + gateway)
# ----------------------------------------------------------------------------
# Sem HSTS: o template não tem modo `edge` (TLS no container); quem fala HTTPS com o cliente
# é o gateway, e HSTS em dev quebraria http://localhost. Produtos com `edge` acrescentam
# security-headers-prod.conf (copiar do kailos).
# ============================================================================

# Anti-Clickjacking: impede embed em iframe de outro domínio.
add_header X-Frame-Options "SAMEORIGIN" always;

# Trava MIME-type: navegador respeita o Content-Type sem "adivinhar".
add_header X-Content-Type-Options "nosniff" always;

# Privacidade: limita info enviada no Referer ao navegar para outros sites.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Bloqueia APIs sensíveis não usadas. `microphone=()`: o chat não grava áudio no browser.
# microphone=(self): o composer do WhatsApp grava áudio no próprio app (getUserMedia).
# Com microphone=() o browser recusa sem nem perguntar ("não foi possível acessar o
# microfone") — Kailos prod 2026-10-09; local não aparecia porque o `bun dev` não passa
# pelo nginx. Só a própria origem; iframes de terceiros seguem sem microfone.
# geolocation=(self): o anexo "Localização" do inbox WhatsApp usa navigator.geolocation (pedido
# do usuário, 2026-10-09). Com geolocation=() o browser nega sem nem perguntar.
add_header Permissions-Policy "camera=(), microphone=(self), geolocation=(self), interest-cohort=(), payment=(), usb=(), magnetometer=(), gyroscope=()" always;

# Cross-Origin isolation (mesmo valor dos produtos; `same-origin-allow-popups` é o que o
# Google OAuth popup exige quando o app clonado ganhar login).
add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
add_header Cross-Origin-Resource-Policy "same-site" always;

# CSP — defesa principal contra XSS. Cada host/fonte abaixo existe por uma razão:
# - 'unsafe-inline' em style-src → Tailwind/Radix injetam <style> inline (Vite também em prod).
# - 'wasm-unsafe-eval' em script-src → WebAssembly (shiki/oniguruma do @streamdown/code,
#   mermaid). SEM isto o CSP bloqueia o compile do wasm; o erro só aparece no console, e só em
#   produção (em dev o Vite não emite CSP).
# - blob: em img-src/media-src/connect-src → anexos previewados via URL.createObjectURL;
#   `prompt-input` faz `fetch(blob:)`, que passa por connect-src igual a host remoto.
# - data: em connect-src → `fetch(data:...)` de anexo já codificado (use-chat-session.ts).
# - img-src https: → logos de provider (models.dev) e imagens devolvidas pelas tools.
# - frame-src 'self' blob: → preview de PDF/anexo em <iframe> (própria origem ou blob URL);
#   frame-src declarado NÃO herda o 'self' do default-src.
# - static.cloudflareinsights.com (script) + cloudflareinsights.com (connect) → beacon do
#   Cloudflare Web Analytics injetado pela borda; são hosts DIFERENTES (script e POST /cdn-cgi/rum).
# - Toda API externa chamada por fetch entra em connect-src (regra: `rg 'fetch\("https://'
#   frontend/src` tem que bater com esta lista). Hoje só o same-origin /api.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' blob: data: https://cloudflareinsights.com; frame-src 'self' blob:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

# NOTA: X-XSS-Protection foi DELIBERADAMENTE removido (deprecated desde 2019; CSP o substitui).
