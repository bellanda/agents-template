# ============================================================================
# COMPRESSION — gzip dinâmico
# ----------------------------------------------------------------------------
# O template não compila o módulo Brotli nem pré-comprime o bundle (sem
# vite-plugin-compression2), então serve gzip dinâmico. Produtos com esse pipeline usam o
# compression.conf do kailos (brotli_static + gzip_static). Nível baixo: prioriza latência.
# ============================================================================

gzip on;
gzip_vary on;                   # Vary: Accept-Encoding (importante para CDNs)
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 256;

gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/json
    application/ld+json
    application/xml
    application/xml+rss
    application/manifest+json
    application/wasm
    application/vnd.api+json
    image/svg+xml
    font/ttf
    font/otf;
