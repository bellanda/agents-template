# ============================================================================
# HEALTHZ — endpoint para health check do orquestrador (Docker, k8s, LB)
# ----------------------------------------------------------------------------
# `access_log off` evita poluir logs com pings de healthcheck a cada N segundos.
# Não inclui security headers — é endpoint interno, response trivial.
# ============================================================================

location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
}