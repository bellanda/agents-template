# =============================================================================
# NATS SERVER CONFIGURATION — PROD
# Tier: prod | RAM: 32.0GB | vCPUs: 8
# Tier values mirror the fleet canonical (akmeo). Edit by hand.
# =============================================================================

listen: 0.0.0.0:4222
http: 0.0.0.0:8222

max_payload: 8MB
max_connections: 65536

# `store_dir` é relativo ao CWD do processo nats-server (não ao arquivo de
# config). Em container o CWD é `/`, então resolve para `/data/nats/jetstream`
# (volume `natsdata` deve mapear para `/data/nats`). Em host-puro (`uv run
# nats-server` em `backend/`), resolve para `backend/data/nats/jetstream`.
jetstream {
  store_dir: "./data/nats/jetstream"
  max_mem: 1G
  max_file: 50G
}
