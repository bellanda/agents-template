include:
  # Two orthogonal axes, both in `.env`:
  #   ENVIRONMENT  → per-env app config (workers, resources, VITE_* build args).
  #   INGRESS_MODE → ingress topology (nginx ports + networks). Default loopback so dev boots
  #                  without setting anything; staging/prod MUST set it in `.env`.
  - path: config/docker/compose.${ENVIRONMENT}.yaml
  - path: config/docker/ingress.${INGRESS_MODE:-loopback}.yaml

x-no-new-privs: &no-new-privs
  security_opt:
    - no-new-privileges:true

# `${VAR}` interpolation here is ONLY for secrets from `.env`; anything env-aware is a literal
# in config/docker/compose.<env>.yaml (skill python-config-bootstrap).
# =============================================================================
# Healthcheck — one pace for every service; the rest is per-service.
# BOOT: `start_interval: 1s` polls once a second during `start_period`, so the
# `depends_on: service_healthy` chain stops paying a whole `interval` per link.
# STEADY STATE: `interval: 10s`. A 1s `pg_isready` forever had no consumer — in
# plain Compose a healthcheck restarts nothing, it only gates `depends_on` and
# labels `docker compose ps`.
# TRAP: `start_interval` WITHOUT `start_period` is a HARD Compose error
# ("healthcheck.start_interval requires healthcheck.start_period to be set") and
# the container never starts. They always travel together — measured 2026-10-02.
# PER-SERVICE: `test`, `timeout` (weight of the check itself) and `start_period`
# (how long that process honestly takes to come up).
# =============================================================================
x-healthcheck-pace: &healthcheck-pace
  interval: 10s
  start_interval: 1s
  retries: 3

services:
  postgres:
    container_name: agents-template-postgres
    image: postgres:18.4-trixie
    <<: *no-new-privs
    environment:
      POSTGRES_DB: agents_template
      POSTGRES_USER: agents_template
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql
    networks:
      - internal
    healthcheck:
      <<: *healthcheck-pace
      test: ["CMD-SHELL", "pg_isready -d agents_template -U agents_template"]
      timeout: 1s
      start_period: 15s
    restart: always
    stop_grace_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "30m"
        max-file: "5"
        compress: "true"

  valkey:
    container_name: agents-template-valkey
    image: valkey/valkey:8.1.8-alpine
    <<: *no-new-privs
    # Cache only (UDS, no TCP port). AOF everysec; allkeys-lru bounds memory — every key MUST carry
    # a TTL or be re-creatable (skill `infra`). Messaging is NATS, never Valkey.
    command: >
      valkey-server
      --unixsocket /run/valkey/valkey.sock
      --unixsocketperm 770
      --port 0
      --appendonly yes
      --appendfsync everysec
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save ""
      --requirepass ${VALKEY_PASSWORD}
    volumes:
      - valkey-data:/data
      - valkey-sock:/run/valkey
    networks:
      - internal
    # Run directly as valkey (uid 999, gid 1000): the image ships /data and /run/valkey owned by
    # valkey. Skips the entrypoint's root chown branch, which needs CHOWN + DAC_READ_SEARCH
    # (dropped) and otherwise crash-loops on `find: Permission denied`. The backend (gid 1000)
    # reaches the socket through the 770 group permission.
    user: "999:1000"
    cap_drop: [ALL]
    environment:
      VALKEY_PASSWORD: ${VALKEY_PASSWORD}
    healthcheck:
      <<: *healthcheck-pace
      test:
        [
          "CMD-SHELL",
          "valkey-cli -s /run/valkey/valkey.sock -a $$VALKEY_PASSWORD --no-auth-warning ping",
        ]
      timeout: 3s
      start_period: 15s
    restart: always
    stop_grace_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"

  nats:
    container_name: agents-template-nats
    image: nats:2.14.2-alpine
    <<: *no-new-privs
    command: ["-c", "/etc/nats/nats-server.conf"]
    volumes:
      - ./config/nats/${ENVIRONMENT}.conf:/etc/nats/nats-server.conf:ro
      - natsdata:/data/nats
    networks:
      - internal
    cap_drop: [ALL]
    cap_add:
      - SETGID
      - SETUID
    healthcheck:
      <<: *healthcheck-pace
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8222/healthz"]
      timeout: 1s
      start_period: 15s
    restart: always
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
        compress: "true"

  migrate:
    container_name: agents-template-migrate
    image: ghcr.io/amacneil/dbmate:2.33.0
    <<: *no-new-privs
    command: ["--wait", "up"]
    environment:
      DATABASE_URL: postgres://agents_template:${POSTGRES_PASSWORD}@postgres:5432/agents_template?sslmode=disable
    volumes:
      - ./backend/db:/db:ro
    networks:
      - internal
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - /tmp:size=16M,mode=1777
    depends_on:
      postgres:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
        compress: "true"

  backend:
    container_name: agents-template-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        APP_UID: ${APP_UID:-1000}
    <<: *no-new-privs
    user: "${APP_UID:-1000}:1000"
    env_file:
      - .env
    environment:
      # Beats the host-style DATABASE_URL that `.env` may carry for bare-metal dev: the compose
      # `environment:` wins over `env_file:`, and config/tools.py loads `.env` with override=False.
      DATABASE_URL: postgres://agents_template:${POSTGRES_PASSWORD}@postgres:5432/agents_template?sslmode=disable
      # Granian constants; per-env sizing (workers, RSS, lifetime) is in compose.<env>.yaml.
      GRANIAN_INTERFACE: asgi
      GRANIAN_HTTP: auto
      GRANIAN_LOOP: uvloop
      # Container-internal paths beat the host-style values in config/app/<env>.yaml (see
      # settings._apply_env_overrides).
      VALKEY_SOCK_PATH: /run/valkey/valkey.sock
      NATS_URL: nats://nats:4222
    volumes:
      - ./config/app/${ENVIRONMENT}.yaml:/app/app.yaml:ro
      - ./backend/uploads:/app/uploads
      - valkey-sock:/run/valkey:ro
    networks:
      - internal
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      # Chat attachments are spooled to /tmp (routes/agents/chat.py) before MarkItDown runs.
      - /tmp:size=128M,mode=1777
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      nats:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      <<: *healthcheck-pace
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      timeout: 5s
      start_period: 30s
    restart: always
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "10"
        compress: "true"

  nginx:
    container_name: agents-template-nginx
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: nginx-runtime
    <<: *no-new-privs
    volumes:
      - ./config/nginx/snippets:/etc/nginx/snippets:ro
      - ./config/nginx/conf.d/shared.conf:/etc/nginx/conf.d/00-shared.conf:ro
      # Server block picked by INGRESS_MODE (loopback/gateway: plain :80).
      - ./config/nginx/conf.d/server.${INGRESS_MODE:-loopback}.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - internal
    cap_drop: [ALL]
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck-pace
      test: ["CMD-SHELL", "curl -fsS http://localhost/healthz >/dev/null || exit 1"]
      timeout: 3s
      start_period: 10s
    restart: always
    stop_grace_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "10"
        compress: "true"

volumes:
  pgdata:
  valkey-data:
  valkey-sock:
  natsdata:

networks:
  internal:
    driver: bridge
